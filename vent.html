<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>윗집에 한마디 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Noto+Sans+KR:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* one visual world: a night apartment block, arcade-yellow hits */
  --night:#0d0b14;
  --panel:#15111d;
  --field:#1f1a2a;
  --line:#3a3249;
  --ink:#f4efe6;
  --muted:#a59db5;
  --accent:#FFD23F;
  --calm:#5BE0B3;
  --display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#120e1a}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.dragging{cursor:grabbing}
.spin-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(255,30,60,0);}
.top{position:absolute;left:0;right:0;top:0;padding:10px 16px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.bar{display:flex;align-items:center;gap:8px;height:44px}
.bar .title{display:flex;flex-direction:column;flex:1}
.bar .title b{font-size:17px;font-weight:900}
.bar .title span{font-size:12px;color:var(--muted)}
.icon-btn{pointer-events:auto;width:44px;height:44px;border-radius:22px;border:none;background:rgba(21,17,29,.55);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:focus-visible,.btn:focus-visible,#send:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gauge{display:flex;flex-direction:column;gap:6px;padding:0 6px}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline}
.gauge .row span{font-size:12px;font-weight:700;color:#d8d0e6}
#mood{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.track{height:12px;border-radius:6px;background:#2a2436;border:2px solid #1a1423;overflow:hidden}
#fill{height:100%;width:100%;border-radius:6px}
#bubble{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
#bubble .in{position:relative;padding:10px 15px;border-radius:18px;background:#fff;color:#1a1423;font-weight:900;font-size:15px;white-space:nowrap;border:3px solid #1a1423;box-shadow:0 4px 0 #1a1423;transform-origin:20% 100%}
#bubble .in::after{content:"";position:absolute;left:22px;bottom:-11px;width:16px;height:16px;background:#fff;border-right:3px solid #1a1423;border-bottom:3px solid #1a1423;transform:rotate(45deg)}
#bubble .in.pop{animation:bubblePop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bubblePop{0%{transform:scale(.3)}100%{transform:scale(1)}}
#combo{position:absolute;right:18px;top:34%;text-align:center;font-family:var(--display);font-style:italic;color:#fff;-webkit-text-stroke:2.5px #1a1423;paint-order:stroke fill;text-shadow:4px 5px 0 #FF4D6D;line-height:1;pointer-events:none;opacity:0;transform:rotate(-10deg)}
#combo b{display:block;font-size:56px;font-weight:400}
#combo i{display:block;font-size:20px;letter-spacing:2px;font-style:italic}
#combo.go{animation:comboPop 1.3s ease-out forwards}
@keyframes comboPop{0%{opacity:1;transform:rotate(-10deg) scale(.4)}10%{transform:rotate(-10deg) scale(1.5)}22%{transform:rotate(-10deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:rotate(-10deg) scale(.9) translateY(-14px)}}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-120px);display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--calm);color:#0f2a20;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .6s cubic-bezier(.2,1.5,.4,1);pointer-events:none}
#toast.show{transform:translate(-50%,0)}
.composer{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:var(--panel);box-shadow:0 -10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}
.hint{margin:0;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.hint b{color:var(--accent);font-variant-numeric:tabular-nums}
.inrow{display:flex;gap:10px;align-items:center}
.field{position:relative;flex:1;min-width:0;height:56px;border-radius:28px;border:2px solid var(--line);background:var(--field);overflow:hidden}
.field:focus-within{border-color:var(--accent)}
.field.locked{border-color:var(--calm)}
#mirror,#msg{position:absolute;inset:0;padding:0 20px;font-family:var(--body);font-size:17px;line-height:52px;letter-spacing:0;white-space:pre;border:0;margin:0}
#mirror{color:var(--ink);overflow:hidden;pointer-events:none}
#mirror .fly{color:#fff;text-shadow:0 0 10px rgba(255,210,63,.9)}
#mirror .hit{color:var(--accent);font-weight:700}
#mirror .ph{color:#8f87a0}
#msg{width:100%;background:transparent;color:transparent;caret-color:var(--accent);outline:none}
#msg:disabled{cursor:default}
#send{flex:none;width:56px;height:56px;border-radius:28px;border:none;background:var(--accent);color:#1a1423;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 #1a1423}
#send:disabled{opacity:.4;cursor:default}
#send.ready{animation:ready 1s ease-in-out infinite}
@keyframes ready{50%{transform:scale(1.1)}}
.btns{display:flex;gap:10px}
.throws{display:flex;gap:10px}
.wok-meter{margin:-4px 0 0;font-size:12px;color:var(--muted);text-align:center}
.wok-meter b{color:var(--accent);font-variant-numeric:tabular-nums}
.throw{flex:1;height:50px;border-radius:25px;border:none;font-family:var(--body);font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #1a1423;transition:transform .08s}
.throw:disabled{opacity:.4;cursor:default}
.throw:active{transform:translateY(3px);box-shadow:0 1px 0 #1a1423}
.throw.tomato{background:#e5332a;color:#fff}
.throw.egg{background:#fff6e2;color:#1a1423}
.throw[aria-pressed='true']{outline:3px solid var(--accent);outline-offset:3px;transform:translateY(2px);box-shadow:0 2px 0 #1a1423}
#c.aiming{cursor:crosshair}
.btn{flex:1;height:46px;border-radius:23px;border:2px solid var(--line);background:transparent;color:var(--ink);font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:32px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){#combo.go{animation-duration:.01s}#send.ready{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="윗집 이웃 캐릭터에게 메시지 단어가 날아가는 3D 장면" role="img"></canvas>
  <div id="vignette"></div>
  <div id="fail">이 브라우저에서는 3D 화면을 띄울 수 없어요. WebGL이 켜진 브라우저에서 열어주세요.</div>

  <div class="top">
    <div class="bar">
      <button class="icon-btn" id="back" aria-label="화풀기 닫기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="title"><b id="ttl">윗집에 한마디</b><span>화풀이 전용 · 실제로는 전달되지 않아요</span></div>
      <button class="icon-btn" id="sound" aria-label="효과음 끄기" aria-pressed="true">
        <svg id="sndOn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg id="sndOff" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
    <div class="gauge">
      <div class="row"><span>윗집 기분</span><b id="mood">폭발 직전 · 100</b></div>
      <div class="track"><div id="fill"></div></div>
      <div class="spin-hint">↔ 좌우로 드래그하면 돌아가요 · 뒤통수도 맞힐 수 있어요</div>
    </div>
  </div>

  <div id="bubble"><div class="in" id="bubbleIn">뭐요?! 나 가만히 있었는데!</div></div>
  <div id="combo" aria-hidden="true"><b id="comboN">2</b><i>COMBO</i></div>
  <div id="toast" role="status">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
    후련하죠? 실제로는 아무에게도 안 보냈어요
  </div>

  <div class="composer">
    <p class="hint"><span id="hintText">띄어쓰기를 누를 때마다 단어가 날아가요</span><span>명중 <b id="hitCount">0</b></span></p>
    <div class="inrow">
      <div class="field" id="field">
        <div id="mirror" aria-hidden="true"><span class="ph">조용히 해달라고 말해보세요</span></div>
        <label for="msg" class="sr">윗집에 보낼 메시지</label>
        <input id="msg" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
      </div>
      <button id="send" aria-label="메시지 보내기" disabled>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg>
      </button>
    </div>
    <div class="throws">
      <button class="throw tomato" id="throwTomato" aria-label="토마토 던지기">🍅 토마토</button>
      <button class="throw egg" id="throwEgg" aria-label="계란 던지기">🥚 계란</button>
    </div>
    <p class="wok-meter" id="wokMeter">🍳 토마토·계란 10개 맞히면 토계볶! <b id="wokN">0</b>/10</p>
    <div class="btns">
      <button class="btn" id="demo">자동 시연 보기</button>
      <button class="btn" id="reset">처음부터</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = (s) => document.querySelector(s);
const app = $('#app'), canvas = $('#c'), input = $('#msg'), mirror = $('#mirror');
const ACCENT = '#FFD23F', INK = '#1a1423';
// 쉿!그널 앱에서 열 때 넘겨주는 호수 (?to=윗집, ?from=우리 집). 숫자·영문·-만 받는다
const qs = new URLSearchParams(location.search);
const unitParam = (k, d) => (/^[0-9A-Za-z-]{1,8}$/.test(qs.get(k) || '') ? qs.get(k) : d);
const TO = unitParam('to', '윗집'), FROM = unitParam('from', '우리 집');
$('#ttl').textContent = TO === '윗집' ? '윗집에 한마디' : `${TO}호에 한마디`;
// 닫기: 앱(부모 창)에 알린다
$('#back').addEventListener('click', () => parent !== window ? parent.postMessage({ type: 'vent-close' }, location.origin) : history.back());
const L = (a, b, k) => a + (b - a) * k;
const C = (x) => Math.max(0, Math.min(1, x));
const rnd = (a, b) => a + Math.random() * (b - a);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  $('#fail').style.display = 'flex';
  throw e;
}
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a0f1c, 14, 34);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
const CAM = new THREE.Vector3(0, 0.4, 10);
const LOOK = new THREE.Vector3(0, 1.2, 0);

function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  CAM.z = Math.max(9, 4.7 / (2 * Math.tan(THREE.MathUtils.degToRad(25)) * camera.aspect));
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------- materials ---------- */
const grad = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]), 3, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (c) => new THREE.MeshToonMaterial({ color: c, gradientMap: grad });
const darkMat = new THREE.MeshBasicMaterial({ color: 0x2a1d2e });
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x1a1423, side: THREE.BackSide });
function outline(mesh, s = 1.05) {
  const o = new THREE.Mesh(mesh.geometry, outlineMat);
  o.scale.setScalar(s);
  mesh.add(o);
  return mesh;
}

/* ---------- canvas textures (Korean fonts load lazily, so redraw when ready) ---------- */
function fontsFor(text) {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  return Promise.all([
    document.fonts.load('100px "Black Han Sans"', text),
    document.fonts.load('700 100px "Noto Sans KR"', text)
  ]).catch(() => {});
}
function liveTexture(w, h, draw, text) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  if (text) fontsFor(text).then(() => { ctx.clearRect(0, 0, w, h); draw(ctx, w, h); tex.needsUpdate = true; });
  return tex;
}
const measureCtx = document.createElement('canvas').getContext('2d');
function measure(text, font) { measureCtx.font = font; return measureCtx.measureText(text).width; }
function fitFont(ctx, text, px, family, maxW, weight = '') {
  let size = px;
  ctx.font = `${weight} ${size}px ${family}`;
  const w = ctx.measureText(text).width;
  if (w > maxW) { size = Math.floor(size * maxW / w); ctx.font = `${weight} ${size}px ${family}`; }
  return size;
}

function chipTexture(text, bg = ACCENT) {
  const px = 96, pad = 38;
  const W = Math.ceil(measure(text, `${px}px "Black Han Sans", sans-serif`) * 1.12 + pad * 2);
  const H = 150;
  const tex = liveTexture(W, H, (ctx) => {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 12; ctx.strokeStyle = INK; ctx.strokeRect(6, 6, W - 12, H - 12);
    fitFont(ctx, text, px, '"Black Han Sans", sans-serif', W - pad * 2);
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, W / 2, H / 2 + 6);
  }, text);
  return { tex, aspect: W / H };
}
function labelTexture(text, { px = 120, fill = ACCENT, stroke = INK, sw = 18 } = {}) {
  const W = Math.ceil(measure(text, `${px}px "Black Han Sans", sans-serif`) * 1.15 + sw * 2 + 30);
  const H = Math.ceil(px * 1.55);
  const tex = liveTexture(W, H, (ctx) => {
    fitFont(ctx, text, px, '"Black Han Sans", sans-serif', W - sw * 2 - 20);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = sw; ctx.strokeStyle = stroke;
    ctx.fillStyle = stroke; ctx.fillText(text, W / 2 + 4, H / 2 + 10);
    ctx.strokeText(text, W / 2, H / 2);
    ctx.fillStyle = fill; ctx.fillText(text, W / 2, H / 2);
  }, text);
  return { tex, aspect: W / H };
}
function cardTexture(text) {
  const W = 640, pad = 44, lh = 54;
  measureCtx.font = '700 38px "Noto Sans KR", sans-serif';
  const lines = []; let line = '';
  for (const word of text.split(' ')) {
    const t = line ? line + ' ' + word : word;
    if (measureCtx.measureText(t).width > W - pad * 2 && line) { lines.push(line); line = word; } else line = t;
  }
  if (line) lines.push(line);
  const shown = lines.slice(0, 5);
  if (lines.length > 5) shown[4] = shown[4] + '…';
  const H = pad * 2 + shown.length * lh + 40;
  const tex = liveTexture(W, H, (ctx) => {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 12; ctx.strokeStyle = INK; ctx.strokeRect(6, 6, W - 12, H - 12);
    ctx.fillStyle = '#7a7088'; ctx.font = '700 24px "Noto Sans KR", sans-serif';
    ctx.fillText(FROM === '우리 집' ? '우리 집의 한마디' : `${FROM}호의 한마디`, pad, pad + 6);
    ctx.fillStyle = INK; ctx.font = '700 38px "Noto Sans KR", sans-serif'; ctx.textBaseline = 'top';
    shown.forEach((l, i) => ctx.fillText(l, pad, pad + 34 + i * lh));
  }, text);
  return { tex, aspect: W / H };
}
function dotTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.4, 'rgba(255,255,255,.8)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); return t;
}
function heartTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.translate(64, 70); g.beginPath();
  g.moveTo(0, 38); g.bezierCurveTo(-60, -4, -40, -52, 0, -22); g.bezierCurveTo(40, -52, 60, -4, 0, 38); g.closePath();
  g.lineWidth = 10; g.strokeStyle = INK; g.stroke(); g.fillStyle = '#ff6f93'; g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function veinTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.translate(64, 64); g.strokeStyle = '#e0182d'; g.lineWidth = 13; g.lineCap = 'round';
  for (let i = 0; i < 4; i++) { g.save(); g.rotate(i * Math.PI / 2); g.beginPath(); g.moveTo(-46, -12); g.quadraticCurveTo(-12, -12, -12, -46); g.stroke(); g.restore(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const DOT = dotTexture(), HEART = heartTexture(), VEIN = veinTexture();

/* ---------- world ---------- */
const bgCalm = new THREE.Color().setHSL(236 / 360, .38, .12, THREE.SRGBColorSpace);
const bgRage = new THREE.Color().setHSL(350 / 360, .45, .11, THREE.SRGBColorSpace);
scene.background = bgRage.clone();

const stars = (() => {
  const g = new THREE.BufferGeometry(); const p = [];
  for (let i = 0; i < 260; i++) p.push(rnd(-22, 22), rnd(4, 22), rnd(-18, -8));
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: .8, fog: false });
  return new THREE.Points(g, m);
})();
scene.add(stars);

scene.add(new THREE.HemisphereLight(0x9aa0ff, 0x2a1020, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 7); scene.add(key);
const roomLight = new THREE.PointLight(0xff6040, 6, 9, 1); roomLight.position.set(0, 2.4, -1.2); scene.add(roomLight);

// facade with a window opening at x[-1.5,1.5], y[0.9,3.7]
const SILL = 0.9, TOP = 3.7, HALF = 1.5;
const wallMat = toon(0x3a2c4a);
const wallParts = [
  [-(HALF + 3.5), 3, 7, 26], [HALF + 3.5, 3, 7, 26],
  [0, (TOP + 16) / 2, HALF * 2, 16 - TOP], [0, (SILL - 10) / 2, HALF * 2, SILL + 10]
];
for (const [x, y, w, h] of wallParts) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.6), wallMat); m.position.set(x, y, -0.3); scene.add(m);
}

  if (!S.sent) $('#hintText').textContent = S.item ? `${S.item === 'tomato' ? '🍅' : '🥚'} 캐릭터를 누르면 그 자리로 던져요 (게이지는 그대로)` : '띄어쓰기를 누를 때마다 단어가 날아가요';
  wok.g.traverse((o) => {
    o.geometry?.dispose();
    if (!o.material || o.material === outlineMat) return; // 테두리 재질은 다른 곳과 같이 쓴다
    if (o.material.map && o.material.map !== DOT) o.material.map.dispose();
    o.material.dispose();
  });

  $('#wokMeter').innerHTML = `🍳 토마토·계란 10개 맞히면 토계볶! <b id="wokN">${S.thrown || 0}</b>/10`;
}

const pointer = new THREE.Vector2();
function pickCharacter(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  pointer.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const parts = [skull, ...ears, body, ...fists.filter((f) => f.visible)];
  const hit = ray.intersectObjects(parts, false)[0];
  if (!hit) return null;
  return { obj: hit.object, local: hit.object.worldToLocal(hit.point.clone()), normal: hit.face.normal.clone().normalize() };
}

function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ---------- state ---------- */
const S = {
  yaw: 0, yawV: 0, // 좌우 회전 (드래그)
  T: 0, freeze: 0, anger: 100, shown: 100, sent: false, sentT: -9,
  sq: 0, sqv: 0, rx: 0, rxv: 0, rz: 0, rzv: 0, kz: 0, kzv: 0, flash: 0, shake: 0, punch: 0,
  combo: 0, lastHit: -9, hits: 0, launched: 0, words: [], tier: 'rage', demo: null, megaPending: false
};
const projs = [], fx = [];

function tierOf() {
  if (S.sent) return 'peace';
  if (S.anger > 70) return 'rage';
  if (S.anger > 40) return 'mad';

  return 'sorry';
}
// 지금 카메라 쪽으로 뒤통수가 보이는지
const isBack = () => Math.cos(S.yaw) < -0.2;
const BACK_BUBBLES = { rage: '아야! 뒤통수는 반칙이지!', mad: '누구야 뒤에서?!', meh: '아 뒤통수... 알겠어요', sorry: '뒤돌아서 반성할게요' };
const BUBBLES = { rage: '뭐요?! 나 가만히 있었는데!', mad: '...그렇게 시끄러웠어요?', meh: '아, 몰랐어요...', sorry: '죄송해요, 조심할게요', peace: '앞으로 살살 다닐게요!' };
const MOODS = { rage: '폭발 직전', mad: '부글부글', meh: '머쓱', sorry: '미안미안', peace: '평화' };

/* ---------- projectiles ---------- */
const tmpV = new THREE.Vector3();
function screenPoint(nx, ny, dist) {
  const v = new THREE.Vector3(nx, ny, 0.5).unproject(camera).sub(camera.position).normalize();
  return camera.position.clone().addScaledVector(v, dist);
}
function wordBlock(word) {
  const { tex, aspect } = chipTexture(word);
  const h = 0.52, w = h * aspect;
  const side = toon(ACCENT), face = new THREE.MeshBasicMaterial({ map: tex });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), [side, side, side, side, face, face]);
  m.userData.own = [m.geometry, side, face, tex];
  return m;
}
function messageCard(text) {
  const { tex, aspect } = cardTexture(text);
  const w = 2.3, h = w / aspect;
  const side = new THREE.MeshBasicMaterial({ color: 0xffffff }), face = new THREE.MeshBasicMaterial({ map: tex });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.07), [side, side, side, side, face, face]);
  m.userData.own = [m.geometry, side, face, tex];
  return m;
}
function launch(word, idx, delay = 0) {
  const len = Array.from(word).length;
  const shown = len > 12 ? Array.from(word).slice(0, 12).join('') + '…' : word;
  const mesh = wordBlock(shown); mesh.visible = false; scene.add(mesh);
  projs.push({
    mesh, word: shown, len: Math.min(len, 12), idx,
    start: screenPoint(rnd(-0.35, 0.35), -0.72, 3.4),
    off: new THREE.Vector3(rnd(-0.42, 0.42), rnd(-0.3, 0.32), 0.82),
    t0: S.T + delay, dur: 0.44 + Math.min(len, 8) * 0.025,
    arc: rnd(1.2, 2.4), side: rnd(-1.4, 1.4), turns: Math.random() < 0.5 ? -1 : 1, wob: rnd(-1, 1), whooshed: false
  });
  S.words[idx] = 'fly';
}
function launchMega(text) {
  const mesh = messageCard(text); mesh.visible = false; scene.add(mesh);
  projs.push({
    mesh, mega: true, word: text, len: 10, idx: -1,
    start: screenPoint(0, -0.6, 3.0), off: new THREE.Vector3(0, 0, 0.9),
    t0: S.T + 0.45, dur: 0.85, arc: 2.6, side: 0, turns: 1, wob: 0.3, whooshed: false

function shards(word, pos, h) {

function confetti() {

  }
}
function disposeObj(o) {

}

function impact(p, hitPos) {
  const now = S.T;
  if (p.mega) return finale(hitPos);
  if (p.item) return itemImpact(p, hitPos);
  S.combo = now - S.lastHit < 1.4 ? S.combo + 1 : 1; S.lastHit = now;
  const mult = 1 + Math.min(S.combo - 1, 6) * 0.08;
  const dmg = Math.min(S.anger, Math.round((2.5 + p.len * 1.2) * mult * (isBack() ? 1.3 : 1))); // 뒤통수 보너스
  S.anger = Math.max(0, S.anger - dmg);
  S.hits++; if (p.idx >= 0) S.words[p.idx] = S.words[p.idx] ? 'hit' : S.words[p.idx];
  const back = isBack();
  const dir = (Math.sign(p.off.x) || 1) * (back ? -1 : 1); // 뒤에서 맞으면 반대로 젖혀진다
  const k = reduceMotion ? 0.35 : 1;
  S.sqv += (2.6 + p.len * 0.25) * k;
  S.rxv -= (5 + p.len * 0.5) * k * (back ? -1 : 1); // 뒤통수를 맞으면 앞으로 꾸벅
  S.rzv -= dir * (4 + p.len * 0.6) * k;
  S.kzv -= (3 + p.len * 0.3) * k;
  S.flash = 1; S.shake = Math.min(1, (0.35 + p.len * 0.06)) * k; S.punch = 1 * k;
  S.freeze = reduceMotion ? 0 : Math.min(0.09, 0.04 + p.len * 0.005);
  const calm = S.anger <= 15;
  ring(hitPos, calm ? 0xff9ab7 : 0xffffff, 1 + p.len * 0.05);
  const pops = calm ? ['토닥', '콕!', '톡!'] : back ? ['뒤통수!', '딱밤!', '콩!', '뒤통수 퍽!'] : ['퍽!', '빡!', '쾅!', '팍!', '퍼억!', '딱!', '와장창!'];
  label(pops[Math.floor(Math.random() * pops.length)], hitPos.clone().add(new THREE.Vector3(rnd(-0.4, 0.4), 0.7, 0.6)), { px: 120 }, 0.95, 'pop', 0.75);
  if (dmg > 0) label('-' + dmg, hitPos.clone().add(new THREE.Vector3(dir * 0.9, -0.1, 0.5)), { px: 90, fill: '#ffffff', sw: 14 }, 0.45, 'float', 1, new THREE.Vector3(0, 1.1, 0));
  shards(p.word, hitPos, 0.42);
  if (calm) {
    for (let i = 0; i < 8; i++) heart(hitPos, new THREE.Vector3(rnd(-2.5, 2.5), rnd(0.5, 3), rnd(0, 1.5)), rnd(0.22, 0.36));
  } else {
    const cols = [0xFFD23F, 0xffffff, 0xFF4D6D];
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2, sp = rnd(3, 8);
      spark(hitPos, cols[i % 3], rnd(0.12, 0.28), new THREE.Vector3(Math.cos(a) * sp, Math.sin(a) * sp, rnd(0, 3)), rnd(0.25, 0.5));
    }
  }
  if (S.combo >= 2) {
    const el = $('#combo'); $('#comboN').textContent = S.combo;
    el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  }
  thump(p.len); buzz(14 + p.len * 2);
  renderMirror();
}

function finale(hitPos) {
  S.anger = 0; S.sent = true; S.sentT = S.T; S.sentWall = performance.now() / 1000;
  S.sqv += 3.6; S.rxv -= 7; S.kzv -= 5; S.flash = 1; S.shake = reduceMotion ? 0.3 : 1.2; S.punch = 1.4; S.freeze = reduceMotion ? 0 : 0.12;
  ring(hitPos, 0xffffff, 2.2);
  setTimeout(() => ring(head.getWorldPosition(new THREE.Vector3()), 0xff9ab7, 3), 120);
  label('속 시원!', hitPos.clone().add(new THREE.Vector3(0, 1.3, 0.8)), { px: 120, fill: '#5BE0B3' }, 1.1, 'pop', 1.4);
  for (let i = 0; i < 18; i++) heart(hitPos, new THREE.Vector3(rnd(-3, 3), rnd(1, 4), rnd(0, 2)), rnd(0.26, 0.42), 1.8);
  confetti(); chime(); buzz(40);
  setTimeout(() => $('#toast').classList.add('show'), 600);
  $('#field').classList.add('locked');
  input.disabled = true;
  $('#hintText').textContent = '속이 좀 풀리셨나요? 진짜로 알리려면 닫고 정중하게 보내 주세요';
  renderMirror(); syncSend();
}

/* ---------- input: the sentence stays, each finished word flies ---------- */
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function renderMirror() {
  const v = input.value;
  if (!v) { mirror.innerHTML = S.sent ? '' : '<span class="ph">조용히 해달라고 말해보세요</span>'; }
  else {
    let i = 0, html = '';
    v.replace(/(\S+)|(\s+)/g, (m, word, sp) => {
      if (word) { const st = S.words[i++]; html += st ? `<span class="${st}">${esc(word)}</span>` : esc(word); }
      else html += sp;
      return m;
    });
    mirror.innerHTML = html;
  }
  mirror.scrollLeft = input.scrollLeft;
  $('#hitCount').textContent = S.hits;
}
function syncSend() {
  const can = !S.sent && !S.megaPending && input.value.trim().length > 0;
  $('#send').disabled = !can;
  $('#send').classList.toggle('ready', can && S.anger <= 15);
}
function onInput() {
  if (S.sent) return;
  audio();
  const v = input.value;
  fontsFor(v);
  const done = v.match(/\S+(?=\s)/g) || [];
  if (done.length > S.launched) {
    for (let i = S.launched; i < done.length; i++) launch(done[i], i, (i - S.launched) * 0.09);
    S.launched = done.length;
  } else if (done.length < S.launched) {
    S.launched = done.length; S.words.length = done.length;
  }
  renderMirror(); syncSend();
}
function send() {
  if (S.sent || S.megaPending) return;
  const v = input.value.trim();
  if (!v) return;
  const all = v.split(/\s+/);
  if (all.length > S.launched) { for (let i = S.launched; i < all.length; i++) launch(all[i], i, (i - S.launched) * 0.09); S.launched = all.length; }
  S.megaPending = true;
  launchMega(v);
  renderMirror(); syncSend();
}
input.addEventListener('input', onInput);
input.addEventListener('scroll', () => { mirror.scrollLeft = input.scrollLeft; });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); stopDemo(); setTimeout(send, 30); }
  else if (S.demo) stopDemo();
});
$('#send').addEventListener('click', () => { audio(); stopDemo(); send(); });

function resetAll() {

  for (const f of fx) disposeObj(f.obj); fx.length = 0;
  clearDecals();
  disposeWok(); S.thrown = 0; $('#wokN').textContent = 0;
  Object.assign(S, { yaw: 0, yawV: 0, anger: 100, sent: false, sentT: -9, combo: 0, lastHit: -9, hits: 0, launched: 0, words: [], megaPending: false });
  input.disabled = false; input.value = '';
  $('#toast').classList.remove('show'); $('#field').classList.remove('locked');
  $('#hintText').textContent = '띄어쓰기를 누를 때마다 단어가 날아가요';
  renderMirror(); syncSend();
}
// 토마토·계란: 골라 두고 캐릭터를 누르면 그 자리로 던진다 (다시 누르면 해제)

const DEMO = '밤마다 쿵쿵 소리가 들려서 잠을 못 자고 있어요 조금만 살살 걸어주시면 정말 감사하겠습니다';

/* ---------- 좌우 드래그로 돌리기 · 짧게 누르면 토마토·계란 던지기 ---------- */
const TAP_PX = 8;
const drag = { on: false, x: 0, t: 0, x0: 0, y0: 0, t0: 0, moved: false };
canvas.addEventListener('pointerdown', (e) => {
  Object.assign(drag, { on: true, x: e.clientX, t: performance.now(), x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false });
  S.yawV = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {} // 드물게 이미 끝난 포인터면 무시
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag.on) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < TAP_PX) return; // 아직은 누르기
  if (!drag.moved) { drag.moved = true; canvas.classList.add('dragging'); }
  const now = performance.now(), dx = e.clientX - drag.x;
  const d = dx * 0.012; // 화면 폭의 반쯤 밀면 반 바퀴
  S.yaw += d;
  S.yawV = d / Math.max(0.008, (now - drag.t) / 1000); // 손을 떼면 그 속도로 조금 더 돈다
  drag.x = e.clientX; drag.t = now;
});
const endDrag = (e) => {
  if (!drag.on) return;
  drag.on = false; canvas.classList.remove('dragging');
  if (!drag.moved) {
    S.yawV = 0;
    // 짧게 눌렀으면: 골라 둔 토마토·계란을 누른 부위로
    if (e?.type === 'pointerup' && performance.now() - drag.t0 < 500) {
      if (wok) { $('#hintText').textContent = '🍳 지글지글 볶는 중이에요. 잠깐만 기다려 주세요'; return; }
      if (!S.item) { $('#hintText').textContent = '🍅 토마토나 🥚 계란을 먼저 골라 주세요'; return; }
      const aim = pickCharacter(e.clientX, e.clientY);
      if (aim) throwItem(S.item, aim);
    }
    return;
  }
  if (performance.now() - drag.t > 80) S.yawV = 0; // 멈췄다 뗐으면 관성 없음
  S.yawV = Math.max(-14, Math.min(14, S.yawV));
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const bubbleEl = $('#bubble'), bubbleIn = $('#bubbleIn'), fillEl = $('#fill'), moodEl = $('#mood'), vigEl = $('#vignette');
const ctrl = new THREE.Vector3(), hitPos = new THREE.Vector3(), headTop = new THREE.Vector3();
const winCol = new THREE.Color(), tmpC = new THREE.Color();
let lastMood = '';

function spring(x, v, k, c, dt) { v += (-k * x - c * v) * dt; return [x + v * dt, v]; }

function frame() {
  const dtReal = Math.min(0.05, clock.getDelta());
  let dt = dtReal;
  if (S.freeze > 0) { S.freeze -= dtReal; dt = 0; }
  S.T += dt;
  const T = S.T, now = performance.now() / 1000;

  // projectiles
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i];
    const u = (T - p.t0) / p.dur;
    if (u < 0) { p.mesh.visible = false; continue; }
    if (!p.whooshed) { p.whooshed = true; if (p.item) throwSound(p.item); else if (!p.mega) whoosh(); }
    p.mesh.visible = true;
    const target = p.aim ? p.aim.obj.localToWorld(tmpV.copy(p.aim.local)) : head.getWorldPosition(tmpV).add(p.off);
    const e = Math.min(1, u), ee = e * e * 0.35 + e * 0.65;
    ctrl.copy(p.start).lerp(target, 0.5); ctrl.y += p.arc; ctrl.x += p.side;
    const a = (1 - ee) * (1 - ee), b = 2 * (1 - ee) * ee, c = ee * ee;
    p.mesh.position.set(a * p.start.x + b * ctrl.x + c * target.x, a * p.start.y + b * ctrl.y + c * target.y, a * p.start.z + b * ctrl.z + c * target.z);
    const pop = Math.min(1, u * 7);
    p.mesh.scale.setScalar(pop * (1 + 0.2 * Math.sin(Math.PI * e)));
    p.mesh.rotation.set(Math.sin(e * Math.PI) * 0.7 * p.wob, p.turns * Math.PI * 2 * ee, Math.sin(e * Math.PI * 2) * 0.25);
    if (dt > 0 && !reduceMotion && Math.random() < 0.85) spark(p.mesh.position, p.mega ? 0xffffff : p.item ? ITEM[p.item].trail : 0xFFD23F, rnd(0.08, 0.18), new THREE.Vector3(rnd(-.4, .4), rnd(-.4, .4), rnd(-.4, .4)), 0.3, 0);
    if (u >= 1) { hitPos.copy(target); disposeObj(p.mesh); projs.splice(i, 1); impact(p, hitPos.clone()); }
  }

  // fx
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i], o = f.obj;
    f.life -= dt; f.age += dt;
    if (f.life <= 0) { disposeObj(o); fx.splice(i, 1); continue; }
    const lk = f.life / f.max;
    f.v.y -= f.g * dt; f.v.multiplyScalar(Math.pow(f.drag, dt * 60));
    o.position.addScaledVector(f.v, dt);
    if (f.av) { o.rotation.x += f.av.x * dt; o.rotation.y += f.av.y * dt; o.rotation.z += f.av.z * dt; }
    if (f.kind === 'spark') { o.scale.setScalar(f.s0 * (0.3 + lk)); o.material.opacity = lk; }
    else if (f.kind === 'heart') { o.scale.setScalar(f.s0 * (0.6 + (1 - lk) * 0.8)); o.material.opacity = Math.min(1, lk * 2.5); }
    else if (f.kind === 'ring') { o.scale.setScalar(0.4 + (1 - lk) * 4 * f.s0); o.material.opacity = lk; }
    else if (f.kind === 'shard') { const op = Math.min(1, lk * 3); for (const m of o.material) m.opacity = op; }
    else if (f.kind === 'conf') { f.v.x += Math.sin(now * 3 + o.rotation.y) * 0.03; o.material.opacity = Math.min(1, lk * 3); }
    else if (f.kind === 'pop' || f.kind === 'float') {
      const ag = f.age, s = f.kind === 'pop' ? (ag < 0.08 ? ag / 0.08 * 1.45 : 1.45 - Math.min(1, (ag - 0.08) / 0.14) * 0.45) : Math.min(1, ag * 9);
      const h = o.userData.h * s; o.scale.set(h * o.userData.aspect, h, 1);
      o.material.opacity = lk < 0.35 ? lk / 0.35 : 1;
    }
  }

  updateDecals();
  updateWok();

  // springs
  [S.sq, S.sqv] = spring(S.sq, S.sqv, 420, 13, dt);
  [S.rx, S.rxv] = spring(S.rx, S.rxv, 260, 10, dt);
  [S.rz, S.rzv] = spring(S.rz, S.rzv, 260, 10, dt);
  [S.kz, S.kzv] = spring(S.kz, S.kzv, 200, 12, dt);
  S.flash = Math.max(0, S.flash - dtReal * 4.5);
  S.shake *= Math.pow(0.002, dtReal); if (S.shake < 0.01) S.shake = 0;
  S.punch *= Math.pow(0.004, dtReal);
  S.shown += (S.anger - S.shown) * Math.min(1, dtReal * 7);
  const a = C(S.shown / 100), peace = S.sent;

  // character pose
  const trem = reduceMotion ? 0 : Math.sin(now * 55) * a * a * 0.03;
  let bob = Math.sin(now * 2.2) * (1 - a) * 0.05;
  if (peace) { const h = now - (S.sentWall || now); bob = Math.abs(Math.sin(h * 7)) * 0.35 * Math.max(0, 1 - h / 2.4) + Math.sin(now * 2.4) * 0.04; }
  charRoot.position.set(trem, bob, S.kz * 0.5);
  if (!drag.on) { S.yaw += S.yawV * dtReal; S.yawV *= Math.pow(0.04, dtReal); }
  spin.rotation.y = S.yaw;
  const facing = Math.cos(S.yaw);
  fists.forEach((f) => (f.visible = facing > 0.3));
  hi.scale.set(1 + S.sq * 0.9, 1 - S.sq * 0.9, 1 + S.sq * 0.5);
  head.rotation.set(S.rx * 0.5 + (peace ? Math.sin(now * 2) * 0.05 : 0), Math.sin(now * 0.9) * 0.08 * (1 - a), S.rz * 0.5 + (peace ? Math.sin(now * 3) * 0.08 : 0));

  const hue = peace ? 46 : L(46, 4, a);
  skin.color.setHSL(hue / 360, L(0.92, 0.84, a), L(0.7, 0.57, a), THREE.SRGBColorSpace);
  skin.emissive.setRGB(S.flash * 0.9, S.flash * 0.9, S.flash * 0.9);
  const hitEyes = S.flash > 0.45 && !peace;
  eyeL.g.visible = eyeR.g.visible = !hitEyes && !peace;
  hitL.visible = hitR.visible = hitEyes;
  happyL.visible = happyR.visible = peace;
  const sy = L(1, 0.6, a); eyeL.g.scale.y = eyeR.g.scale.y = sy;
  const ps = L(1.2, 0.72, a), jit = Math.sin(now * 37) * a * 0.015;
  eyeL.p.scale.setScalar(ps); eyeR.p.scale.setScalar(ps); eyeL.p.position.x = eyeR.p.position.x = jit;
  const ang = peace ? -0.15 : L(-0.38, 0.5, a);
  browL.rotation.z = -ang; browR.rotation.z = ang;
  browL.position.y = browR.position.y = peace ? 0.47 : L(0.47, 0.37, a);
  teeth.visible = !peace && a > 0.7;
  mouth.visible = !peace && a <= 0.7;
  smile.visible = peace;
  const curv = L(0.55, -0.9, C(a / 0.7));
  mouth.rotation.z = (curv >= 0 ? Math.PI : 0) + (a < 0.35 ? Math.sin(now * 9) * 0.1 : 0);
  mouth.scale.set(1, Math.max(0.18, Math.abs(curv)), 1);
  mouth.position.y = curv >= 0 ? -0.24 : -0.38;
  blushMat.opacity = peace ? 0.9 : C((0.55 - a) / 0.4) * 0.85;
  vein.visible = !peace && a > 0.4; vein.scale.setScalar(0.38 * (1 + 0.18 * Math.sin(now * 13)));
  sweat.visible = !peace && a > 0.02 && a < 0.5; sweat.position.set(0.7, 0.5 - (now * 0.5 % 1) * 0.25, 0.42);
  fists.forEach((f, i) => {
    const s = i ? 1 : -1;
    f.position.y = peace ? SILL + 1.6 + Math.sin(now * 9 + i * 1.5) * 0.15 : L(SILL + 0.3, SILL + 1.0, a) + Math.sin(now * 38 + i) * a * a * 0.06;
    f.position.x = peace ? s * 1.25 : s * 1.05;
  });

  // atmosphere
  scene.background.copy(bgCalm).lerp(bgRage, peace ? 0 : a);
  scene.fog.color.copy(scene.background);
  winCol.setHSL((peace ? 46 : L(46, 8, a)) / 360, 0.9, L(0.78, 0.6, a), THREE.SRGBColorSpace);
  roomMat.color.copy(winCol);
  roomLight.color.copy(winCol);
  roomLight.intensity = 6 + (a > 0.7 && !reduceMotion ? Math.sin(now * 23) * 1.5 : 0);
  for (const w of winObjs) {
    const want = w.th < 0 ? 1 : (!peace && a > w.th ? 1 : 0);
    w.lit += (want - w.lit) * Math.min(1, dtReal * 3);
    w.m.material.color.copy(litOff).lerp(litOn, w.lit);
  }
  const steamOn = peace ? 0 : C((a - 0.6) / 0.25);
  head.getWorldPosition(headTop);
  steam.forEach((s, i) => {
    const ph = (now * 1.1 + i / steam.length) % 1, side = i % 2 ? 1 : -1;
    s.position.set(headTop.x + side * (0.45 + ph * 0.7), headTop.y + 0.7 + ph * 1.2, headTop.z + 0.1);
    s.scale.setScalar(0.25 + ph * 0.6); s.material.opacity = Math.sin(Math.PI * ph) * steamOn * 0.8;
  });
  const kungOn = peace ? 0 : C((a - 0.42) / 0.4);
  kungs.forEach((s, i) => {
    const ph = (now * 1.6 + i * 0.37) % 1, sc = (ph < 0.12 ? 0.6 + ph * 6 : 1.32 - (ph - 0.12) * 0.4) * 0.55;
    s.scale.set(sc * s.userData.aspect, sc, 1); s.material.opacity = kungOn * (1 - ph * 0.8);
  });

  // camera
  camera.position.copy(CAM);
  camera.position.x += (Math.random() * 2 - 1) * S.shake * 0.12;
  camera.position.y += (Math.random() * 2 - 1) * S.shake * 0.12;
  camera.lookAt(LOOK);
  camera.rotation.z += (Math.random() * 2 - 1) * S.shake * 0.012;
  camera.fov = 50 - S.punch * 3.5; camera.updateProjectionMatrix();

  renderer.render(scene, camera);

  // HTML overlay
  const tier = tierOf();
  const bkey = tier + (isBack() && BACK_BUBBLES[tier] ? '-back' : '');
  if (bkey !== S.tier) { S.tier = bkey; bubbleIn.textContent = bkey.endsWith('-back') ? BACK_BUBBLES[tier] : BUBBLES[tier]; bubbleIn.classList.remove('pop'); void bubbleIn.offsetWidth; bubbleIn.classList.add('pop'); syncSend(); }
  head.getWorldPosition(headTop).add(new THREE.Vector3(0.15, 1.05, 0)); headTop.project(camera);
  const W = app.clientWidth, H = app.clientHeight;
  const bx = (headTop.x * 0.5 + 0.5) * W, by = (-headTop.y * 0.5 + 0.5) * H;
  const bw = bubbleIn.offsetWidth, bh = bubbleIn.offsetHeight;
  const left = Math.max(12, Math.min(W - bw - 12, bx - 24));
  bubbleEl.style.transform = `translate(${left.toFixed(1)}px, ${(by - bh - 14 + Math.sin(now * 3) * 3).toFixed(1)}px)`;
  const moodTxt = `${MOODS[tier]} · ${Math.round(S.shown)}`;
  if (moodTxt !== lastMood) {
    lastMood = moodTxt; moodEl.textContent = moodTxt;
    const col = peace ? '#5BE0B3' : `hsl(${L(150, 2, a).toFixed(0)}, 82%, 60%)`;
    moodEl.style.color = col; fillEl.style.background = col; fillEl.style.width = `${S.shown.toFixed(1)}%`;
  }
  vigEl.style.boxShadow = `inset 0 0 160px rgba(255,30,60,${(peace ? 0 : C((a - 0.55) / 0.45) * (0.34 + 0.12 * Math.sin(now * 6))).toFixed(3)})`;

  requestAnimationFrame(frame);
}


fontsFor('퍽빡쾅팍퍼억딱와장창토닥콕톡속시원쿵윗집우리-0123456789보글치익웍등장토계볶완성철찰빠직덕마란' + TO + DEMO + BUBBLES.rage);
resize(); renderMirror(); syncSend();
requestAnimationFrame(frame);
</script>
